[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-vuln-scanner"
version = "1.0.0"
description = "Modular, safe-by-design, non-destructive web application vulnerability scanner."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Igor Kuchenbecker" }]
keywords = ["security", "appsec", "scanner", "owasp", "web-security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.31,<3",
    "beautifulsoup4>=4.12,<5",
    "rich>=13,<16",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
web-vuln-scanner = "scanner.cli.commands:main"

[project.urls]
Repository = "https://github.com/igorkuchenbecker/zz"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"scanner.reporting.templates" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
